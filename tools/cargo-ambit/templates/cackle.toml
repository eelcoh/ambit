# Level 2 enforcement: which crate may use which API, checked by cackle (`cargo acl`) on the
# compiled code of every crate, dependencies included. Human-owned.
#
# - Apps (under apps/) get no [pkg.*] entry: no restricted API, and no opting out of memory safety.
#   Their effects go through the capabilities handed to init().
# - Run `cargo acl` once to review and accept what the platform and its dependencies need.
#   Build scripts and tests run in a Bubblewrap sandbox.

[common]
version = 2
import_std = ["fs", "net", "process", "env", "terminate"]

[sandbox]
kind = "Bubblewrap"

# What counts as which API, beyond cackle's built-in names: the capability implementations reach
# files and processes through cap-std and rustix too.
[api.fs]
include = [
    "cap-primitives::fs",
    "cap-std::fs",
    "rustix::fs",
]
# A path is a name, not access: building, joining or printing one needs no permission. The path
# functions that do reach the disk are their own API, `path_fs`, below.
exclude = [
    "std::path",
]

# Asking the disk about a path, through std::path (exists, metadata, listing a folder, following
# links). Separate from fs only because cackle can't re-include these under the exclude above.
[api.path_fs]
include = [
    "std::path::Path::exists",
    "std::path::Path::try_exists",
    "std::path::Path::is_file",
    "std::path::Path::is_dir",
    "std::path::Path::is_symlink",
    "std::path::Path::metadata",
    "std::path::Path::symlink_metadata",
    "std::path::Path::canonicalize",
    "std::path::Path::read_link",
    "std::path::Path::read_dir",
    "std::path::absolute",
]

[api.net]
include = [
    "cap-primitives::net",
    "cap-std::net",
    "mio::net",
]

[api.process]
include = [
    "rustix::process",
]
