# Level 2 enforcement (DESIGN.md): which crate may use which API, checked by cackle (`cargo acl`)
# on the compiled code of every crate, dependencies included. Human-owned.
#
# - The apps (`shortener`, `todo`) have no [pkg.*] entry on purpose: they may use no restricted
#   API and no unsafe code. Their effects go through the capabilities handed to init().
# - Proc macros run inside rustc, outside the sandbox. Three need more than token in, tokens out:
#   rustversion (asks rustc its version), document-features (reads Cargo.toml), strum_macros
#   (env). They come in through ratatui.
# - crossterm gets process for its `tput` fallback when the terminal size can't be read.
# - Build scripts and tests run in a Bubblewrap sandbox (no network, writes only to a temp dir).
# - Analysed for the host target. The hermit image is covered by the same app/platform crates,
#   but the kernel itself (the `hermit` crate) is not analysed here.

[common]
version = 2
import_std = ["fs", "net", "process", "env", "terminate"]

[sandbox]
kind = "Bubblewrap"

[pkg.tracing-attributes]
allow_proc_macro = true

[pkg.unicode-ident]
allow_unsafe = true

[pkg.itoa]
allow_unsafe = true

[pkg.proc-macro2]
build.allow_apis = [
    "env",
    "fs",
    "process",
    "terminate",
]
allow_unsafe = true

[pkg.once_cell]
allow_unsafe = true

