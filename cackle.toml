# --- WebSocket (tungstenite and what it pulls in) ----------------------------------------------

# Never built: zerocopy names it under cfg(any()) only to pin its version. cackle lists it from
# the metadata anyway.
[pkg.zerocopy-derive]
allow_proc_macro = true

# rand's ChaCha (ws frame masks) uses it through ppv-lite86. Its build script asks rustc its
# version and reads its own Cargo.toml.
[pkg.zerocopy]
allow_unsafe = true
build.allow_apis = ["env", "fs", "process"]

# The WebSocket protocol. Unsafe only to skip re-checking text it has validated, and for fast
# frame masking. It opens no connections: NativeWebSocket hands it one.
[pkg.tungstenite]
allow_unsafe = true

# random masks for ws frames, as the protocol requires of clients.
[pkg.rand]
allow_unsafe = true

# rand's ChaCha: SIMD.
[pkg.ppv-lite86]
allow_unsafe = true

# ws handshake key (SHA-1, as the protocol requires) and its helpers; SIMD.
[pkg.sha1]
allow_unsafe = true

[pkg.cpufeatures]
allow_unsafe = true

[pkg.block-buffer]
allow_unsafe = true

[pkg.generic-array]
allow_unsafe = true

# build time only: a build script asks rustc its version through it.
[pkg.version_check]
allow_apis = ["env", "process"]

# base64 for the handshake key.
[pkg.data-encoding]
allow_unsafe = true

# --- cargo-ambit reads cackle.toml (toml and its parser) ---------------------------------------

# The TOML tokenizer: unsafe to skip re-checking UTF-8 it has validated.
[pkg.winnow]
allow_unsafe = true

# Built with unsafe code forbidden (its `unsafe` feature is off); cackle sees the word in the
# switched-off code.
[pkg.toml_parser]
allow_unsafe = true

# The cli backend reads the command line and NO_COLOR, and ends the program when an argument
# isn't text. Not in any app: apps depend on ambit-cli.
[pkg.ambit-cli-native]
allow_apis = [
    "env",
    "terminate",
]
test.allow_apis = [
    "fs", "path_fs",
    "process",
]

# The wiring returns the exit code.
[pkg.run-keep]
allow_apis = [
    "process",
]

[pkg.run-up]
allow_apis = [
    "process",
]

# The keep example's argument parser. Both use unsafe only to skip a re-check when turning bytes
# they built from text back into text.
[pkg.clap_lex]
allow_unsafe = true

[pkg.anstyle]
allow_unsafe = true

[api.net]
include = [
    "cap-primitives::net",
    "cap-std::net",
    "mio::net",
]

[api.fs]
include = [
    "cap-primitives::fs",
    "cap-std::fs",
    "rustix::fs",
]
# A path is a name, not access: building, joining or printing one needs no permission. The path
# functions that do reach the disk are their own API, `path_fs`, below.
exclude = [
    "std::path",
]

# Asking the disk about a path, through std::path (exists, metadata, listing a folder, following
# links). Separate from fs only because cackle can't re-include these under the exclude above.
[api.path_fs]
include = [
    "std::path::Path::exists",
    "std::path::Path::try_exists",
    "std::path::Path::is_file",
    "std::path::Path::is_dir",
    "std::path::Path::is_symlink",
    "std::path::Path::metadata",
    "std::path::Path::symlink_metadata",
    "std::path::Path::canonicalize",
    "std::path::Path::read_link",
    "std::path::Path::read_dir",
    "std::path::absolute",
]


[api.process]
include = [
    "rustix::process",
]
