name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, app checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh

  acceptance:
    name: acceptance (native + hermit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - name: Install toolchain and Hermit std
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup toolchain install
          version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          name=rust-std-$version-x86_64-unknown-hermit
          gh release download "$version" --repo hermit-os/rust-std-hermit --pattern "$name.tar.gz"
          tar xf "$name.tar.gz"
          "./$name/install.sh" --prefix="$(rustc --print sysroot)" --disable-ldconfig
          rm -rf "$name" "$name.tar.gz"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/acceptance.sh native
      - run: scripts/hermit-conformance.sh
      - run: scripts/acceptance.sh hermit
