[workspace]
resolver = "3"
members = [
    "caps/api",
    "caps/std",
    "caps/native",
    "caps/sim",
    "caps/net",
    "caps/dir",
    "caps/dir-native",
    "caps/net-native",
    "caps/conformance",
    "platforms/server/api",
    "platforms/server/std",
    "platforms/server/native",
    "platforms/server/hermit",
    "platforms/server/sim",
    "platforms/tui/api",
    "platforms/tui/native",
    "platforms/tui/sim",
    "platforms/cli/api",
    "platforms/cli/native",
    "platforms/cli/sim",
    "apps/shortener",
    "apps/todo",
    "apps/keep",
    "spec",
    "run-native",
    "run-hermit",
    "run-todo",
    "run-keep",
    "tools/cargo-ambit",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ambit-caps = { path = "caps/api" }
ambit-caps-std = { path = "caps/std" }
ambit-caps-native = { path = "caps/native" }
ambit-caps-sim = { path = "caps/sim" }
ambit-caps-net = { path = "caps/net" }
ambit-caps-dir = { path = "caps/dir" }
ambit-caps-dir-native = { path = "caps/dir-native" }
ambit-caps-net-native = { path = "caps/net-native" }
ambit-caps-conformance = { path = "caps/conformance" }
ambit-server = { path = "platforms/server/api" }
ambit-server-std = { path = "platforms/server/std" }
ambit-server-native = { path = "platforms/server/native" }
ambit-server-hermit = { path = "platforms/server/hermit" }
ambit-server-sim = { path = "platforms/server/sim" }
ambit-tui = { path = "platforms/tui/api" }
ambit-tui-native = { path = "platforms/tui/native" }
ambit-tui-sim = { path = "platforms/tui/sim" }
shortener = { path = "apps/shortener" }
ambit-cli = { path = "platforms/cli/api" }
ambit-cli-native = { path = "platforms/cli/native" }
ambit-cli-sim = { path = "platforms/cli/sim" }
todo = { path = "apps/todo" }
keep = { path = "apps/keep" }

cap-std = "4.0.3"
# Argument parsing for the example cli app. No colour, no terminal or environment queries: those
# would reach outside what the app is given. No derive: the code it generates switches off lint
# groups the app rules forbid.
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# What cap-std doesn't offer: rename-without-replacing, free space, syncing a directory. The
# version cap-std already uses.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
getrandom = "0.3"
# Kernel features are added per crate; see DESIGN.md "Hermit: minimal by default".
hermit = { git = "https://github.com/hermit-os/hermit-rs.git", tag = "hermit-0.13.2", default-features = false }
http = "1"
httparse = "1"
ratatui-core = "0.1.2"
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-widgets = { version = "0.3.2", default-features = false }
redb = "2"
serde_json = "1"
# cargo-ambit reads cackle.toml.
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
# rustls with ring and the bundled Mozilla roots; no gzip, no proxy support compiled in by us.
# WebSocket client protocol only: no TLS, no async; connecting is ours.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

# Unikernel images: small and stripped. Keeps unwinding so handler panics become 500s.
[profile.image]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
